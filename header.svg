<style>
text{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .5s ease both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.grow,.fade{animation:none}}

</style>
