<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img">
<style>
text{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .5s ease both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.grow,.fade{animation:none}}

</style>
<rect width="960" height="356" rx="16" fill="#0F1830"/>
<text x="24" y="34" font-size="14" font-weight="700" fill="#E8ECF8">before → after</text>
<text x="24" y="80" font-size="14" font-weight="700" fill="#E8ECF8" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">Prepp API latency</text>
<text x="24" y="99" font-size="11" fill="#8FA0C8">Redis · index tuning · query rewrite</text>
<rect class="grow" style="animation-delay:0.15s" x="330" y="68" width="420" height="16" rx="3" fill="#5B6B99"/>
<text class="fade" style="animation-delay:0.55s" x="758" y="81" font-size="11" fill="#8FA0C8">before</text>
<rect class="grow" style="animation-delay:0.35s" x="330" y="90" width="273" height="16" rx="3" fill="#35D0BA"/>
<text class="fade" style="animation-delay:0.75s" x="611" y="103" font-size="11" fill="#E8ECF8">after</text>
<text class="fade" style="animation-delay:0.85s;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" x="936" y="98" font-size="30" font-weight="800" fill="#35D0BA" text-anchor="end">−35%</text>
<text x="24" y="144" font-size="14" font-weight="700" fill="#E8ECF8" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">Cost per answer evaluation</text>
<text x="24" y="163" font-size="11" fill="#8FA0C8">GPT-4 Vision + Textract OCR</text>
<rect class="grow" style="animation-delay:0.40s" x="330" y="132" width="420" height="16" rx="3" fill="#5B6B99"/>
<text class="fade" style="animation-delay:0.80s" x="758" y="145" font-size="11" fill="#8FA0C8">₹50</text>
<rect class="grow" style="animation-delay:0.60s" x="330" y="154" width="17" height="16" rx="3" fill="#35D0BA"/>
<text class="fade" style="animation-delay:1.00s" x="355" y="167" font-size="11" fill="#E8ECF8">₹2</text>
<text class="fade" style="animation-delay:1.10s;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" x="936" y="162" font-size="30" font-weight="800" fill="#35D0BA" text-anchor="end">−96%</text>
<text x="24" y="208" font-size="14" font-weight="700" fill="#E8ECF8" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">p99 latency under contention</text>
<text x="24" y="227" font-size="11" fill="#8FA0C8">eBPF traced it to scheduler contention</text>
<rect class="grow" style="animation-delay:0.65s" x="330" y="196" width="294" height="16" rx="3" fill="#5B6B99"/>
<text class="fade" style="animation-delay:1.05s" x="632" y="209" font-size="11" fill="#8FA0C8">baseline</text>
<rect class="grow" style="animation-delay:0.85s" x="330" y="218" width="420" height="16" rx="3" fill="#FF5C7A"/>
<text class="fade" style="animation-delay:1.25s" x="758" y="231" font-size="11" fill="#E8ECF8">contended</text>
<text class="fade" style="animation-delay:1.35s;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" x="936" y="226" font-size="30" font-weight="800" fill="#FF5C7A" text-anchor="end">+43%</text>
<text x="24" y="272" font-size="14" font-weight="700" fill="#E8ECF8" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">Throughput under contention</text>
<text x="24" y="291" font-size="11" fill="#8FA0C8">same Kubernetes experiment</text>
<rect class="grow" style="animation-delay:0.90s" x="330" y="260" width="420" height="16" rx="3" fill="#5B6B99"/>
<text class="fade" style="animation-delay:1.30s" x="758" y="273" font-size="11" fill="#8FA0C8">baseline</text>
<rect class="grow" style="animation-delay:1.10s" x="330" y="282" width="265" height="16" rx="3" fill="#FF5C7A"/>
<text class="fade" style="animation-delay:1.50s" x="603" y="295" font-size="11" fill="#E8ECF8">contended</text>
<text class="fade" style="animation-delay:1.60s;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif" x="936" y="290" font-size="30" font-weight="800" fill="#FF5C7A" text-anchor="end">−37%</text>
<rect x="24" y="326" width="12" height="12" rx="2" fill="#35D0BA"/><text x="42" y="336" font-size="11" fill="#8FA0C8">improvement shipped at CollegeDunia</text>
<rect x="318" y="326" width="12" height="12" rx="2" fill="#FF5C7A"/><text x="336" y="336" font-size="11" fill="#8FA0C8">degradation measured on purpose, then traced to its cause</text>
</svg>